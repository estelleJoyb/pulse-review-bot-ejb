name: ai-review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  ai-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: install claude-code
        run: npm install -g @anthropic-ai/claude-code

      - name: extract diff
        run: |
          git fetch origin ${{ github.base_ref }}
          git diff origin/${{ github.base_ref }}...HEAD > /tmp/pr.diff

      - name: ai review
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          chmod +x review-pr.sh
          cat /tmp/pr.diff | ./review-pr.sh > /tmp/review.json

      - name: post comments + gate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 << 'EOF'
          import json, os, sys, urllib.request

          with open('/tmp/review.json') as f:
              findings = json.load(f)

          token = os.environ['GITHUB_TOKEN']
          repo = os.environ['GITHUB_REPOSITORY']
          pr_number = os.environ['PR_NUMBER']
          head_sha = os.environ['HEAD_SHA']

          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'Content-Type': 'application/json',
              'X-GitHub-Api-Version': '2022-11-28',
          }

          def post(url, body):
              req = urllib.request.Request(url, data=json.dumps(body).encode(), headers=headers)
              try:
                  with urllib.request.urlopen(req):
                      pass
              except Exception as e:
                  print(f'warn: {e}', file=sys.stderr)

          base = f'https://api.github.com/repos/{repo}'

          for finding in findings:
              severity = finding.get('severity', 'info').upper()
              category = finding.get('category', '')
              message = finding.get('message', '')
              body_text = f'**[{severity}] {category}**\n\n{message}'

              if finding.get('line') and finding.get('file'):
                  post(f'{base}/pulls/{pr_number}/comments', {
                      'body': body_text,
                      'commit_id': head_sha,
                      'path': finding['file'],
                      'line': int(finding['line']),
                      'side': 'RIGHT',
                  })
              else:
                  post(f'{base}/issues/{pr_number}/comments', {'body': body_text})

          has_critical = any(f.get('severity') == 'critical' for f in findings)
          if has_critical:
              print('::error::AI review blocked: critical finding(s) detected.')
              sys.exit(1)
          EOF
